name: CMake

on: [push, pull_request, workflow_dispatch]

env:
  BUILD_TYPE: Release

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ ubuntu-latest, macos-14, windows-2022, windows-11-arm ]
        cmake_generator: [ default, Ninja ]
      fail-fast: false
    name:  ${{ matrix.os }} build with ${{ matrix.cmake_generator }} cmake generator
    steps:
    - name: Install X
      if: matrix.os == 'ubuntu-latest'
      run: sudo apt update && sudo apt install -y libgl1-mesa-dev xorg-dev libasound2-dev libcurl4-openssl-dev

    - uses: actions/checkout@v4
      with:
        submodules: "recursive"

    - name: Setting up Ninja build system
      if: matrix.cmake_generator == 'Ninja'
      uses: seanmiddleditch/gha-setup-ninja@master

    - name: Set up MSVC compiler
      if: runner.os == 'Windows'
      uses: ilammy/msvc-dev-cmd@v1
      with:
        arch: ${{ runner.arch == 'ARM64' && 'arm64' || 'x64' }}

    # The standalone player (e.g. 88emuPlayer) is opt-in via a cmake flag, so CI builds
    # the plugin formats only unless it is turned on. macOS additionally gets the AU.
    - name: Enable standalone builds on macOS
      if: matrix.os == 'macos-14'
      run: echo "CMAKE_ARGS=-Dgearmulator_BUILD_JUCEPLUGIN_Standalone=ON" >> "$GITHUB_ENV"

    - name: Configure CMake with ${{ matrix.cmake_generator }}
      if: matrix.cmake_generator != 'default'
      run: cmake -G ${{ matrix.cmake_generator }} -B ${{github.workspace}}/build -DCMAKE_BUILD_TYPE=${{env.BUILD_TYPE}} ${{env.CMAKE_ARGS}}

    - name: Configure CMake with default generator
      if: matrix.cmake_generator == 'default'
      run: cmake -B ${{github.workspace}}/build -DCMAKE_BUILD_TYPE=${{env.BUILD_TYPE}} ${{env.CMAKE_ARGS}}

    # Turns compiler output into annotations, so a failed build reports the actual error
    # on the run and through the API instead of just a non-zero exit code.
    - name: Register compiler problem matcher
      shell: bash
      run: |
        if [ "${{ runner.os }}" = "Windows" ]; then
          echo "::add-matcher::.github/problem-matchers/msvc.json"
        else
          echo "::add-matcher::.github/problem-matchers/gcc.json"
        fi

    - name: Build
      run: cmake --build ${{github.workspace}}/build --config ${{env.BUILD_TYPE}} --parallel 3

    - name: Pack
      working-directory: ${{github.workspace}}/build
      run: cmake -P ${{github.workspace}}/scripts/pack.cmake

    # Keep each product in its own artifact. CPack emits one archive per product
    # and format; uploading the whole build directory as one artifact hides that
    # separation and makes it hard to download just one plugin.
    - name: Upload Osirus packages
      uses: actions/upload-artifact@v4
      with:
        name: ${{ matrix.os }}-${{ matrix.cmake_generator }}-Osirus
        path: |
          ${{github.workspace}}/build/TheUsualSuspects-Osirus-*.zip
          ${{github.workspace}}/build/TheUsualSuspects-Osirus-*.deb
          ${{github.workspace}}/build/TheUsualSuspects-Osirus-*.rpm
        if-no-files-found: error

    - name: Upload OsTIrus packages
      uses: actions/upload-artifact@v4
      with:
        name: ${{ matrix.os }}-${{ matrix.cmake_generator }}-OsTIrus
        path: |
          ${{github.workspace}}/build/TheUsualSuspects-OsTIrus-*.zip
          ${{github.workspace}}/build/TheUsualSuspects-OsTIrus-*.deb
          ${{github.workspace}}/build/TheUsualSuspects-OsTIrus-*.rpm
        if-no-files-found: error

    - name: Upload Vavra packages
      uses: actions/upload-artifact@v4
      with:
        name: ${{ matrix.os }}-${{ matrix.cmake_generator }}-Vavra
        path: |
          ${{github.workspace}}/build/TheUsualSuspects-Vavra-*.zip
          ${{github.workspace}}/build/TheUsualSuspects-Vavra-*.deb
          ${{github.workspace}}/build/TheUsualSuspects-Vavra-*.rpm
        if-no-files-found: error

    - name: Upload Xenia packages
      uses: actions/upload-artifact@v4
      with:
        name: ${{ matrix.os }}-${{ matrix.cmake_generator }}-Xenia
        path: |
          ${{github.workspace}}/build/TheUsualSuspects-Xenia-*.zip
          ${{github.workspace}}/build/TheUsualSuspects-Xenia-*.deb
          ${{github.workspace}}/build/TheUsualSuspects-Xenia-*.rpm
        if-no-files-found: error

    - name: Upload NodalRed2x packages
      uses: actions/upload-artifact@v4
      with:
        name: ${{ matrix.os }}-${{ matrix.cmake_generator }}-NodalRed2x
        path: |
          ${{github.workspace}}/build/TheUsualSuspects-NodalRed2x-*.zip
          ${{github.workspace}}/build/TheUsualSuspects-NodalRed2x-*.deb
          ${{github.workspace}}/build/TheUsualSuspects-NodalRed2x-*.rpm
        if-no-files-found: error

    - name: Upload JE8086 packages
      uses: actions/upload-artifact@v4
      with:
        name: ${{ matrix.os }}-${{ matrix.cmake_generator }}-JE8086
        path: |
          ${{github.workspace}}/build/TheUsualSuspects-JE8086-*.zip
          ${{github.workspace}}/build/TheUsualSuspects-JE8086-*.deb
          ${{github.workspace}}/build/TheUsualSuspects-JE8086-*.rpm
        if-no-files-found: error

    - name: Upload 88emuPlayer packages
      if: matrix.os == 'macos-14'
      uses: actions/upload-artifact@v4
      with:
        name: ${{ matrix.os }}-${{ matrix.cmake_generator }}-88emuPlayer
        path: |
          ${{github.workspace}}/build/TheUsualSuspects-88emuPlayer-*.zip
          ${{github.workspace}}/build/TheUsualSuspects-88emuPlayer-*.deb
          ${{github.workspace}}/build/TheUsualSuspects-88emuPlayer-*.rpm
        if-no-files-found: error
